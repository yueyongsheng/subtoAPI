name: sub2api-production

services:
  sub2api:
    image: ${SUB2API_IMAGE:?SUB2API_IMAGE must be a fixed version}
    container_name: sub2api
    restart: unless-stopped
    stop_grace_period: 6m
    ports:
      - "${BIND_HOST:-127.0.0.1}:${SERVER_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      SERVER_MODE: ${SERVER_MODE:-release}
      RUN_MODE: ${RUN_MODE:-standard}
      TZ: ${TZ:-Asia/Shanghai}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${SUB2API_DB_USER:?SUB2API_DB_USER is required}
      DATABASE_PASSWORD: ${SUB2API_DB_PASSWORD:?SUB2API_DB_PASSWORD is required}
      DATABASE_DBNAME: ${SUB2API_DB_NAME:-sub2api}
      DATABASE_SSLMODE: disable
      DATABASE_MAX_OPEN_CONNS: ${DATABASE_MAX_OPEN_CONNS:-30}
      DATABASE_MAX_IDLE_CONNS: ${DATABASE_MAX_IDLE_CONNS:-10}
      DATABASE_CONN_MAX_LIFETIME_MINUTES: ${DATABASE_CONN_MAX_LIFETIME_MINUTES:-30}
      DATABASE_CONN_MAX_IDLE_TIME_MINUTES: ${DATABASE_CONN_MAX_IDLE_TIME_MINUTES:-5}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-128}
      REDIS_MIN_IDLE_CONNS: ${REDIS_MIN_IDLE_CONNS:-10}
      REDIS_ENABLE_TLS: "false"
      GATEWAY_OPENAI_FIRST_OUTPUT_TIMEOUT_SECONDS: ${GATEWAY_OPENAI_FIRST_OUTPUT_TIMEOUT_SECONDS:-120}
      GATEWAY_OPENAI_HIGH_EFFORT_FIRST_OUTPUT_TIMEOUT_SECONDS: ${GATEWAY_OPENAI_HIGH_EFFORT_FIRST_OUTPUT_TIMEOUT_SECONDS:-300}
      SECURITY_URL_ALLOWLIST_ENABLED: ${SECURITY_URL_ALLOWLIST_ENABLED:-false}
      SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP: ${SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP:-false}
      SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS: ${SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS:-false}
      SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS: ${SECURITY_URL_ALLOWLIST_UPSTREAM_HOSTS:-}
      GEMINI_OAUTH_CLIENT_ID: ${GEMINI_OAUTH_CLIENT_ID:-}
      GEMINI_OAUTH_CLIENT_SECRET: ${GEMINI_OAUTH_CLIENT_SECRET:-}
      UPDATE_PROXY_URL: ${UPDATE_PROXY_URL:-}
      GATEWAY_MAX_BODY_SIZE: ${GATEWAY_MAX_BODY_SIZE:-268435456}
      GATEWAY_FORCE_CODEX_CLI: ${GATEWAY_FORCE_CODEX_CLI:-false}
      GATEWAY_OPENAI_COMPACT_MODEL: ${GATEWAY_OPENAI_COMPACT_MODEL:-gpt-5.4}
      SUB2API_IMAGES_MAIN_MODEL: ${SUB2API_IMAGES_MAIN_MODEL:-gpt-5.6-luna}
      GATEWAY_OPENAI_WS_FORCE_HTTP: ${GATEWAY_OPENAI_WS_FORCE_HTTP:-false}
      GATEWAY_MAX_CONNS_PER_HOST: ${GATEWAY_MAX_CONNS_PER_HOST:-1024}
      GATEWAY_MAX_IDLE_CONNS: ${GATEWAY_MAX_IDLE_CONNS:-2560}
      GATEWAY_MAX_IDLE_CONNS_PER_HOST: ${GATEWAY_MAX_IDLE_CONNS_PER_HOST:-120}
      GATEWAY_SCHEDULING_STICKY_SESSION_MAX_WAITING: ${GATEWAY_SCHEDULING_STICKY_SESSION_MAX_WAITING:-3}
      GATEWAY_SCHEDULING_STICKY_SESSION_WAIT_TIMEOUT: ${GATEWAY_SCHEDULING_STICKY_SESSION_WAIT_TIMEOUT:-120s}
      GATEWAY_SCHEDULING_FALLBACK_WAIT_TIMEOUT: ${GATEWAY_SCHEDULING_FALLBACK_WAIT_TIMEOUT:-30s}
      GATEWAY_SCHEDULING_FALLBACK_MAX_WAITING: ${GATEWAY_SCHEDULING_FALLBACK_MAX_WAITING:-100}
      GATEWAY_SCHEDULING_LOAD_BATCH_ENABLED: ${GATEWAY_SCHEDULING_LOAD_BATCH_ENABLED:-true}
      GATEWAY_SCHEDULING_SLOT_CLEANUP_INTERVAL: ${GATEWAY_SCHEDULING_SLOT_CLEANUP_INTERVAL:-30s}
      GATEWAY_SCHEDULING_DB_FALLBACK_ENABLED: ${GATEWAY_SCHEDULING_DB_FALLBACK_ENABLED:-true}
      GATEWAY_SCHEDULING_DB_FALLBACK_TIMEOUT_SECONDS: ${GATEWAY_SCHEDULING_DB_FALLBACK_TIMEOUT_SECONDS:-0}
      GATEWAY_SCHEDULING_DB_FALLBACK_MAX_QPS: ${GATEWAY_SCHEDULING_DB_FALLBACK_MAX_QPS:-0}
      GATEWAY_SCHEDULING_OUTBOX_POLL_INTERVAL_SECONDS: ${GATEWAY_SCHEDULING_OUTBOX_POLL_INTERVAL_SECONDS:-1}
      GATEWAY_SCHEDULING_OUTBOX_LAG_WARN_SECONDS: ${GATEWAY_SCHEDULING_OUTBOX_LAG_WARN_SECONDS:-5}
      GATEWAY_SCHEDULING_OUTBOX_LAG_REBUILD_SECONDS: ${GATEWAY_SCHEDULING_OUTBOX_LAG_REBUILD_SECONDS:-10}
      GATEWAY_SCHEDULING_OUTBOX_LAG_REBUILD_FAILURES: ${GATEWAY_SCHEDULING_OUTBOX_LAG_REBUILD_FAILURES:-3}
      GATEWAY_SCHEDULING_OUTBOX_BACKLOG_REBUILD_ROWS: ${GATEWAY_SCHEDULING_OUTBOX_BACKLOG_REBUILD_ROWS:-10000}
      GATEWAY_SCHEDULING_FULL_REBUILD_INTERVAL_SECONDS: ${GATEWAY_SCHEDULING_FULL_REBUILD_INTERVAL_SECONDS:-300}
      GATEWAY_IMAGE_NONSTREAM_KEEPALIVE_INTERVAL: ${GATEWAY_IMAGE_NONSTREAM_KEEPALIVE_INTERVAL:-0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - egress
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE must be fixed}
    container_name: sub2api-postgres
    restart: unless-stopped
    volumes:
      - ./postgres_data:/var/lib/postgresql/18/docker
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      PGDATA: /var/lib/postgresql/18/docker
      SUB2API_DB_USER: ${SUB2API_DB_USER:?SUB2API_DB_USER is required}
      SUB2API_DB_PASSWORD: ${SUB2API_DB_PASSWORD:?SUB2API_DB_PASSWORD is required}
      SUB2API_DB_NAME: ${SUB2API_DB_NAME:-sub2api}
      TZ: ${TZ:-Asia/Shanghai}
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE must be fixed}
    container_name: sub2api-redis
    restart: unless-stopped
    volumes:
      - ./redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --save 60 1 --requirepass "$${REDIS_PASSWORD}"
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

networks:
  backend:
    internal: true
  egress:
    driver: bridge
